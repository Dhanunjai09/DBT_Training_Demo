# =============================================================================
# dbt_project.yml — Kinaxis / Refresco Analytics
# ALL configuration in this file — no environment variables needed.
# To switch environments change audit_db and pipeline_user only.
# =============================================================================

name: 'kinaxis'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# VARS — everything lives here, nothing in dbt Cloud environment variables
# To deploy to QA: change audit_db to REFRESCO_ANALYTICS_QA
# To deploy to PRD: change audit_db to REFRESCO_ANALYTICS_PRD
# =============================================================================
vars:

  # ── Environment (change this per environment) ──────────────────────────────
  audit_db:       "REFRESCO_ANALYTICS_DEV"
  pipeline_user:  "SYSTEM"

  # ── Schema names ───────────────────────────────────────────────────────────
  src_schema:       "EXTRACT_SAP"
  trans_schema:     "TRANSFORMATION_EU_PLANNING"
  reporting_schema: "REPORTING_EU_PLANNING"

  # ── Control / metadata tables ──────────────────────────────────────────────
  audit_table:      "BATCH_AUDIT_LOG"
  audit_seq:        "BATCH_AUDIT_SEQ"
  row_count_table:  "SRC_TGT_ROW_COUNT"
  sttm_table:       "STTM_UPDATED"

  # ── Table suffix conventions ───────────────────────────────────────────────
  temp_suffix:  "_TEMP"
  error_suffix: "_ERROR"

  # ── Incremental watermark ──────────────────────────────────────────────────
  incremental_col:          "INSERTEDAT"
  incremental_default_date: "1900-01-01"

  # ── Standard column names ──────────────────────────────────────────────────
  col_active_flag:       "ACTIVE_FLAG"
  col_created_by:        "CREATED_BY"
  col_modified_by:       "MODIFIED_BY"
  col_created_date:      "CREATED_DATE"
  col_modified_date:     "MODIFIED_DATE"
  col_error_reason:      "ERROR_REASON"
  col_error_captured_at: "ERROR_CAPTURED_AT"

# =============================================================================
# MODELS
# =============================================================================
models:
  kinaxis:
    +persist_docs:
      relation: true
      columns: true
    +materialized: "incremental"
