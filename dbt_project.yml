# =============================================================================
# dbt_project.yml — Kinaxis / Refresco Analytics
# target_database resolves automatically from target.name
# No hardcoded database names anywhere in macros
# =============================================================================

name: 'kinaxis'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# VARS
# target_database resolves from target.name — same pattern as snowflake_warehouse
# All macros use var('target_database') — zero hardcoded DB names
# =============================================================================
vars:

  # ── Database — resolves per environment automatically ──────────────────────
  target_database: >
    {%- if   target.name in ('default', 'dev') -%}REFRESCO_ANALYTICS_DEV
    {%- elif target.name == 'qa'               -%}REFRESCO_ANALYTICS_QA
    {%- elif target.name == 'prd'              -%}REFRESCO_ANALYTICS_PRD
    {%- else                                   -%}REFRESCO_ANALYTICS_DEV
    {%- endif -%}

  # ── Pipeline identity (from real project) ──────────────────────────────────
  pipeline_user:    "adf"
  adf_run_id:       "local"
  adf_pipeline_name: "local"

  # ── Schema names ───────────────────────────────────────────────────────────
  src_schema:       "EXTRACT_SAP"
  trans_schema:     "TRANSFORMATION_EU_PLANNING"
  reporting_schema: "REPORTING_EU_PLANNING"

  # ── Control / metadata tables ──────────────────────────────────────────────
  audit_seq:        "BATCH_AUDIT_SEQ"
  audit_log_suffix: "_AUDITLOG"
  row_count_table:  "SRC_TGT_ROW_COUNT"
  control_table:    "REFRESCO_CONTROL_TABLE"
  sttm_table:       "STTM_UPDATED"

  # ── Table suffix conventions ───────────────────────────────────────────────
  temp_suffix:  "_TEMP"
  error_suffix: "_ERROR"

  # ── Incremental watermark ──────────────────────────────────────────────────
  incremental_col:          "INSERTEDAT"
  incremental_default_date: "1900-01-01"

  # ── Standard audit column names ────────────────────────────────────────────
  col_active_flag:  "ACTIVE_FLAG"
  col_created_by:   "CREATED_BY"
  col_modified_by:  "MODIFIED_BY"
  col_created_date: "CREATED_DATE"
  col_modified_date: "MODIFIED_DATE"

# =============================================================================
# MODELS
# =============================================================================
models:
  kinaxis:
    +persist_docs:
      relation: true
      columns: true
    +materialized: "incremental"
    # ── EU Planning consumption layer ────────────────────────────────────────
    # +materialized only — database and schema are controlled via the
    # generate_schema_name and generate_database_name macros in macros/.
    # Those macros use node.fqn (the folder path) to route each model to the
    # correct schema and database without any hardcoding here.
    # Adding new consumption models? Just drop the .sql into models/eu_planning/
    # and they automatically land in REFRESCO_ANALYTICS_DEV.REPORTING_EU_PLANNING.
    transformation:
      +materialized: "table"